name: Check codegen compatibility

on:
  pull_request:
    paths:
      - ci/run_update_deps.sh
      - scripts/test_update_deps.rb
      - pubspec.yaml
      - scripts/terra/**
      - scripts/testcase_gen/**
      - scripts/*ios_pod*
      - '**/ios/Podfile'
      - lib/**
      - test_shard/integration_test_app/test/**
      - .github/workflows/check_codegen_compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codegen:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test dependency updates including Pod subspecs
        run: ruby scripts/test_update_deps.rb
      - name: Test iOS AOSL provider selection
        run: ruby scripts/test_ios_pod_helpers.rb
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.19.6'
          cache: true
      - name: Generate RTM 2.3.1 bindings and tests
        uses: ./.github/actions/gen_code
        with:
          code_gen_public_headers: rtm_2.3.1
          flutter_channel: stable
          flutter_version: '3.19.6'
      - name: Analyze generated SDK
        run: flutter analyze lib --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run generated SDK unit tests
        working-directory: test_shard/integration_test_app
        run: flutter test --no-pub
