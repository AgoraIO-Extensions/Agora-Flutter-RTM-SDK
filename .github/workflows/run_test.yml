name: 'run: test'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    secrets:
      APP_ID:
        required: true

jobs:
  dependency_update_test:
    name: Dependency updater regression test
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run dependency updater regression tests
        run: bash ci/test_run_update_deps_desktop.sh

  flutter_compatibility:
    name: Flutter ${{ matrix.version }} compatibility
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    # NOTE: `flutter pub get` at the repo root also resolves ./example, so the lowest
    # version testable here is the *example app* floor (Flutter 3.16.0 / Dart 3.2.0),
    # which is what agora_rtc_engine 6.5.4 requires.
    strategy:
      fail-fast: false
      matrix:
        version: ["3.16.0", "3.44.8"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib
      - run: flutter pub get
        working-directory: test_shard/integration_test_app
      - run: flutter test
        working-directory: test_shard/integration_test_app

  flutter_codestyle_check:
    name: Flutter codestyle/analyze check
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
          cache: true
      - name: Check Dart Format
        run: bash scripts/dart_pub_publish_check.sh
      - uses: axel-op/dart-package-analyzer@v3
        id: analysis
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Check scores
        env:
          TOTAL: ${{ steps.analysis.outputs.total }}
          TOTAL_MAX: ${{ steps.analysis.outputs.total_max }}
        run: |
          if (( $TOTAL_MAX - $TOTAL > 20 ))
          then
            echo Pub Score too low.
            exit 1
          fi

  flutter_ut:
    name: Flutter unit test
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
          cache: true
      - name: Run flutter test
        run: flutter test
        working-directory: test_shard/integration_test_app

  integration_test_android:
    name: Run Flutter Android Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.44.8"]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v3
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: run flutter android integration tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_5
          ram-size: 2048M
          heap-size: 4096M
          disk-size: 8192M
          script: bash scripts/run_flutter_integration_test.sh "android"

  integration_test_ios:
    name: Run Flutter iOS Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.44.8"]
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      # agora_rtm ships only a podspec (no Package.swift). SwiftPM is the default
      # from Flutter 3.44 on, which breaks the build, so force CocoaPods.
      # `|| true` because the flag does not exist on older Flutter versions.
      - name: Force CocoaPods instead of Swift Package Manager
        shell: bash
        run: flutter config --no-enable-swift-package-manager || true
      - name: Select and boot an available iPhone simulator
        shell: bash
        run: |
          SIMULATOR_JSON="$(xcrun simctl list devices available --json)"
          FLUTTER_TEST_DEVICE="$(
            jq -r '[.devices[][] | select((.isAvailable // false) and (.name | startswith("iPhone")))] | first | .udid // empty' <<< "${SIMULATOR_JSON}"
          )"
          if [[ -z "${FLUTTER_TEST_DEVICE}" ]]; then
            echo "::error::No available iPhone simulator found."
            exit 1
          fi

          xcrun simctl bootstatus "${FLUTTER_TEST_DEVICE}" -b
          echo "FLUTTER_TEST_DEVICE=${FLUTTER_TEST_DEVICE}" >> "${GITHUB_ENV}"
        continue-on-error: true
      - run: bash scripts/run_flutter_integration_test.sh "ios"
        continue-on-error: true
      - name: Get ios crash logs
        if: always()
        run: |
          sleep 30

          mkdir logs-ios

          CRASH_DIR="${HOME}/Library/Logs/DiagnosticReports/"
          OUTPUT_CRASH_DIR=./logs-ios/crash
          mkdir -p ${OUTPUT_CRASH_DIR}

          # Copy all files
          cp -RP $CRASH_DIR* $OUTPUT_CRASH_DIR || true
        
      - name: Upload ios logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-ios-${{ matrix.version }}
          path: logs-ios/*

  integration_test_macos:
    name: Run Flutter macOS Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.44.8"]
    runs-on: macos-14
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      # agora_rtm ships only a podspec (no Package.swift), so force CocoaPods.
      - name: Force CocoaPods instead of Swift Package Manager
        shell: bash
        run: flutter config --no-enable-swift-package-manager || true
      - name: Update pod repo
        run: pod repo update
        continue-on-error: true
      - run: bash scripts/run_flutter_integration_test.sh "macos"
        continue-on-error: true
      - name: Get macos crash logs
        if: always()
        shell: bash
        run: |
          mkdir -p ./logs-macos/crash
          cp -RP "${HOME}/Library/Logs/DiagnosticReports/"* ./logs-macos/crash || true
      - name: Upload macos logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-macos-${{ matrix.version }}
          path: logs-macos/*
          if-no-files-found: ignore

  integration_test_windows:
    name: Run Flutter Windows Integration Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.44.8"]
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TEST_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Run integration tests
        continue-on-error: true
        shell: bash
        run: bash scripts/run_flutter_integration_test.sh "windows"

  build_android_ubuntu:
    name: Build Android on Ubuntu
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.44.8"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - name: Run flutter build apk
        run: flutter build apk
        working-directory: example

  build_android_minimum:
    name: Build Android with Flutter 3.10.0
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.10.0
          cache: true
      - name: Build plugin in a Flutter 3.10 Android host
        shell: bash
        run: |
          set -euo pipefail

          SMOKE_DIR="${RUNNER_TEMP}/agora_rtm_flutter_minimum"
          flutter create --platforms=android --org io.agora.validation "${SMOKE_DIR}"
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' "${SMOKE_DIR}/android/app/build.gradle"
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' "${SMOKE_DIR}/android/app/build.gradle"

          cd "${SMOKE_DIR}"
          dart pub add "agora_rtm:{\"path\":\"${GITHUB_WORKSPACE}\"}"
          flutter build apk --release

  build_android_windows:
    name: Build Android on Windows
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.44.8"]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v3
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter pub get
      - name: Run flutter build apk
        run: flutter build apk
        working-directory: example

  build_ios:
    name: Build iOS
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.44.8"]
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      # agora_rtm ships only a podspec (no Package.swift), so force CocoaPods.
      - name: Force CocoaPods instead of Swift Package Manager
        shell: bash
        run: flutter config --no-enable-swift-package-manager || true
      - run: flutter pub get
      - name: Run flutter build ios --no-codesign
        run: flutter build ios --no-codesign
        working-directory: example

  build_ios_minimum:
    name: Build iOS with Flutter 3.10.0
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.10.0
          cache: true
      - name: Build plugin in a Flutter 3.10 iOS host
        shell: bash
        run: |
          set -euo pipefail

          SMOKE_DIR="${RUNNER_TEMP}/agora_rtm_flutter_minimum_ios"
          flutter create --platforms=ios --org io.agora.validation "${SMOKE_DIR}"
          cd "${SMOKE_DIR}"
          dart pub add "agora_rtm:{\"path\":\"${GITHUB_WORKSPACE}\"}"
          flutter build ios --no-codesign

  build_macos:
    name: Build macOS
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.41.9", "3.44.8"]
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      # agora_rtm ships only a podspec (no Package.swift), so force CocoaPods.
      - name: Force CocoaPods instead of Swift Package Manager
        shell: bash
        run: flutter config --no-enable-swift-package-manager || true
      - name: Update pod repo
        run: pod repo update
      - run: flutter pub get
      - name: Run flutter build macos
        run: flutter build macos
        working-directory: example

  build_macos_minimum:
    name: Build macOS with Flutter 3.10.0
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.10.0
          cache: true
      - name: Update pod repo
        run: pod repo update
      - name: Build plugin in a Flutter 3.10 macOS host
        shell: bash
        run: |
          set -euo pipefail

          SMOKE_DIR="${RUNNER_TEMP}/agora_rtm_flutter_minimum_macos"
          flutter create --platforms=macos --org io.agora.validation "${SMOKE_DIR}"
          cd "${SMOKE_DIR}"
          dart pub add "agora_rtm:{\"path\":\"${GITHUB_WORKSPACE}\"}"
          flutter build macos

  build_windows:
    name: Build Windows
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      fail-fast: false
      matrix:
        version: ["3.41.9", "3.44.8"]
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - name: Check Windows SDK artifacts
        shell: bash
        run: |
          IRIS_SDK_DOWNLOAD_URL="$(sed -n 's/^[[:space:]]*set(IRIS_SDK_DOWNLOAD_URL[[:space:]]*"\([^"]*\)".*/\1/p' windows/cmake/DownloadSDK.cmake | head -n 1)"
          NATIVE_SDK_DOWNLOAD_URL="$(sed -n 's/^[[:space:]]*set(NATIVE_SDK_DOWNLOAD_URL[[:space:]]*"\([^"]*\)".*/\1/p' windows/cmake/DownloadSDK.cmake | head -n 1)"
          if [[ -z "${IRIS_SDK_DOWNLOAD_URL}" ]]; then
            echo "::error::IRIS_SDK_DOWNLOAD_URL is missing from windows/cmake/DownloadSDK.cmake."
            exit 1
          fi
          if [[ -z "${NATIVE_SDK_DOWNLOAD_URL}" ]]; then
            echo "::error::NATIVE_SDK_DOWNLOAD_URL is missing from windows/cmake/DownloadSDK.cmake."
            exit 1
          fi
      - run: flutter pub get
      - name: Run flutter build windows
        run: flutter build windows
        working-directory: example

  build_windows_minimum:
    name: Build Windows with Flutter 3.10.0
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.10.0
          cache: true
      - name: Build plugin in a Flutter 3.10 Windows host
        shell: bash
        run: |
          set -euo pipefail

          SMOKE_DIR="${RUNNER_TEMP}/agora_rtm_flutter_minimum_windows"
          flutter create --platforms=windows --org io.agora.validation "${SMOKE_DIR}"
          cd "${SMOKE_DIR}"
          # Backslashes in GITHUB_WORKSPACE are invalid JSON escapes; pub accepts
          # forward slashes on Windows.
          dart pub add "agora_rtm:{\"path\":\"${GITHUB_WORKSPACE//\\//}\"}"
          flutter build windows

  # This job aim to cover https://github.com/flutter/flutter/issues/135739
  build_ios_xcode_15:
    name: Build iOS with xcode 15.x
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    strategy:
      matrix:
        version: ["3.41.9"]
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: | # https://github.com/actions/runner-images/issues/6746#issuecomment-1380042553
          # set xcode version to use for build
          sudo xcode-select -switch /Applications/Xcode_15.0.1.app
          # Print used xCode version
          xcode-select -print-path
          xcodebuild -version
      # agora_rtm ships only a podspec (no Package.swift). SwiftPM is the default
      # from Flutter 3.44 on, so force CocoaPods to keep this job working if the
      # pinned version is ever bumped.
      # `|| true` because the flag does not exist on older Flutter versions.
      - name: Force CocoaPods instead of Swift Package Manager
        shell: bash
        run: flutter config --no-enable-swift-package-manager || true
      - run: flutter pub get
      - name: Run flutter build ios --no-codesign
        run: flutter build ios --no-codesign
        working-directory: example
