name: 'run: build example'

on:
  workflow_dispatch:
    inputs:
      target_platforms:
        description: 'Target platforms, e.g. android, ios, macos, windows, web, etc; separated by comma, default is all platforms'
        type: string
        required: true
        default: 'android, ios, macos, windows'
      target_branch:
        description: 'Target branch, leave empty will use the same as the workflow trigger branch'
        type: string
      issue_number:
        description: 'The number of the issue or pull request to comment build results on, leave empty will not comment on any PR'
        type: number
        required: false
      extra_build_options:
        description: 'Extra build options when running `flutter build`, e.g. --verbose, --device-id'
        type: string
        required: false
        default: ''
      extra_build_arguments:
        description: 'Extra build arguments when running `flutter build apk/ipa/other sub-commands`, e.g. --debug, --dart-define=APP_ID=1234567890, --dart-define-from-file=path/to/file.dart'
        type: string
        required: false
        default: ''
      flutter_channel:
        description: 'Target Flutter channel, e.g. stable(default), beta, dev, master (or main), or any other channel name'
        type: string
        required: false
        default: 'stable'
      flutter_version:
        description: 'Target Flutter version(s), separated by comma, e.g. "3.24.5, 3.41.9". Keep every version below 3.44 until agora_rtm ships Swift Package Manager support, because SwiftPM is the default from 3.44 on.'
        type: string
        required: false
        default: '3.24.5, 3.41.9'
      app_id_secrets:
        description: 'App ID secret(s) used for builds'
        type: choice
        required: false
        default: 'MY_APP_ID'
        options:
          - 'MY_APP_ID'
          - 'APP_ID_RTM'
          - 'MY_APP_ID, APP_ID_RTM'
  workflow_call:
    inputs:
      target_platforms:
        description: 'Target platforms, e.g. android, ios, macos, windows, web, etc; separated by comma, default is all platforms'
        type: string
        default: 'android, ios, macos, windows'
      target_branch:
        description: 'Target branch, leave empty will use the same as the workflow trigger branch'
        type: string
      issue_number:
        description: 'The number of the issue or pull request to comment build results on, leave empty will not comment on any PR'
        type: number
        required: false
      extra_build_options:
        description: 'Extra build options when running `flutter build`, e.g. --verbose, --device-id'
        type: string
        required: false
        default: ''
      extra_build_arguments:
        description: 'Extra build arguments when running `flutter build apk/ipa/other sub-commands`, e.g. --debug, --dart-define=APP_ID=1234567890, --dart-define-from-file=path/to/file.dart'
        type: string
        required: false
        default: ''
      flutter_channel:
        description: 'Target Flutter channel, e.g. stable(default), beta, dev, master (or main), or any other channel name'
        type: string
        required: false
        default: 'stable'
      flutter_version:
        description: 'Target Flutter version(s), separated by comma, e.g. "3.24.5, 3.41.9". Keep every version below 3.44 until agora_rtm ships Swift Package Manager support, because SwiftPM is the default from 3.44 on.'
        type: string
        required: false
        default: '3.24.5, 3.41.9'
      app_id_secrets:
        description: 'App ID secret(s) used for builds, separated by comma'
        type: string
        required: false
        default: 'MY_APP_ID'
    secrets:
      MY_APP_ID:
        required: false
      APP_ID_RTM:
        required: false
      BUILD_PROVISION_PROFILE_UUID:
        required: true
      BUILD_PROVISION_PROFILE_NAME:
        required: true
      BUILD_PROVISION_PROFILE_TEAMID:
        required: true
      BUILD_PROVISION_PROFILE_IDENTITY:
        required: true
      BUILD_CERTIFICATE_BASE64:
        required: true
      P12_PASSWORD:
        required: true
      BUILD_PROVISION_PROFILE_BASE64:
        required: true
      KEYCHAIN_PASSWORD:
        required: true
        

jobs:
  # remove label ci:build_example if the issue_number is not null and the workflow is run by workflow_call not workflow_dispatch
  remove-label:
    if: ${{ inputs.issue_number != null}}
    runs-on: ubuntu-latest
    steps:
      - name: Remove label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ inputs.issue_number }}
          labels: ci:build_example
          fail_on_error: false

  split-platforms:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.split-platforms.outputs.platforms }}
    steps:
      - id: split-platforms
        env:
          target_platforms: ${{ inputs.target_platforms }}
        run: |
          platforms=$(echo "$target_platforms" | sed 's/ //g' | tr ',' '\n' | sort -u | sed '/^$/d' | jq -R -s -c 'split("\n")[:-1]')
          echo "splited platforms: $platforms"
          # remove not supported platforms, only keep supported platforms: android, ios, macos, windows, web
          platforms=$(echo "$platforms" | jq -e 'map(select(. == "android" or . == "ios" or . == "macos" or . == "windows" or . == "web"))')
          # make platforms in oneline, and keep json format
          platforms=$(echo "$platforms" | jq -c .)
          echo "final jsonlized platforms: $platforms"
          echo "platforms=$platforms" >> $GITHUB_OUTPUT

  # Build a single `include` list pairing each requested platform with the cheapest
  # runner that can build it and with every requested Flutter version. Android and
  # web build fine on ubuntu, which is both faster to schedule and cheaper than
  # macos; only ios/macos actually need a macos runner.
  build-matrix:
    runs-on: ubuntu-latest
    needs: split-platforms
    outputs:
      include: ${{ steps.build-matrix.outputs.include }}
    steps:
      - id: build-matrix
        env:
          platforms: ${{ needs.split-platforms.outputs.platforms }}
          flutter_versions: ${{ inputs.flutter_version }}
          app_id_secrets: ${{ inputs.app_id_secrets }}
        run: |
          set -euo pipefail

          versions=$(echo "$flutter_versions" | sed 's/ //g' | tr ',' '\n' | sed '/^$/d' | jq -R -s -c 'split("\n")[:-1]')
          echo "requested versions: $versions"

          app_ids=$(printf '%s' "$app_id_secrets" | sed 's/ //g' | tr ',' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ "$(echo "$app_ids" | jq 'length')" -eq 0 ]; then
            echo "::error::At least one App ID secret is required"
            exit 1
          fi
          if [ "$(echo "$app_ids" | jq '[.[] | select(. != "MY_APP_ID" and . != "APP_ID_RTM")] | length')" -ne 0 ]; then
            echo "::error::App ID secrets must be MY_APP_ID or APP_ID_RTM"
            exit 1
          fi
          if [ "$(echo "$app_ids" | jq 'length')" -ne "$(echo "$app_ids" | jq 'unique | length')" ]; then
            echo "::error::App ID secrets must not contain duplicates"
            exit 1
          fi
          echo "requested app id secrets: $app_ids"

          include=$(jq -c -n \
            --argjson platforms "$platforms" \
            --argjson versions "$versions" \
            --argjson app_ids "$app_ids" \
            '
              # Cheapest runner able to build each platform.
              {
                android: "ubuntu-latest",
                web:     "ubuntu-latest",
                windows: "windows-2022",
                ios:     "macos-14",
                macos:   "macos-14"
              } as $runners
              | [ $platforms[] as $p
                  | $versions[] as $v
                  | $app_ids[] as $a
                  | { platform: $p,
                      version: $v,
                      app_id_secret: $a,
                      os: $runners[$p],
                      # Each platform/app_id pair is now built once per Flutter version, but
                      # the job outputs used by the PR comment are keyed by platform only.
                      # Mark the first requested version as primary so exactly one job per
                      # platform/app_id pair writes that output and the comment is stable.
                      primary: ($v == $versions[0]) }
                  | select(.os != null) ]
            ')

          echo "final include: $include"
          echo "include=$include" >> $GITHUB_OUTPUT

  build:
    name: build (${{ matrix.platform }}, Flutter ${{ matrix.version }}, ${{ matrix.app_id_secret }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-matrix.outputs.include) }}
    env:
        platform: ${{ matrix.platform }}
        extra_build_options: ${{ inputs.extra_build_options }}
        extra_build_arguments: ${{ inputs.extra_build_arguments }}
    outputs:
      artifact_nightly_link_android: ${{ steps.setup_output.outputs.artifact_nightly_link_android }}
      artifact_nightly_link_ios: ${{ steps.setup_output.outputs.artifact_nightly_link_ios }}
      artifact_nightly_link_macos: ${{ steps.setup_output.outputs.artifact_nightly_link_macos }}
      artifact_nightly_link_windows: ${{ steps.setup_output.outputs.artifact_nightly_link_windows }}
      artifact_nightly_link_web: ${{ steps.setup_output.outputs.artifact_nightly_link_web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: '1'
          lfs: 'true'
          submodules: 'true'

      - name: Setup JDK for Android
        if: ${{ matrix.platform == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup signing key for iOS
        if: ${{ matrix.platform == 'ios' }}
        working-directory: example/ios
        env:
          DEFAULT_BUILD_PROVISION_PROFILE_NAME: ${{ secrets.BUILD_PROVISION_PROFILE_NAME }}
          DEFAULT_BUILD_PROVISION_PROFILE_TEAMID: ${{ secrets.BUILD_PROVISION_PROFILE_TEAMID }}
          DEFAULT_BUILD_PROVISION_PROFILE_IDENTITY: ${{ secrets.BUILD_PROVISION_PROFILE_IDENTITY }}
          DEFAULT_BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          DEFAULT_BUILD_P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          DEFAULT_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          DEFAULT_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/${{ secrets.BUILD_PROVISION_PROFILE_UUID }}.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$DEFAULT_BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$DEFAULT_BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

          # create temporary keychain
          security create-keychain -p "$DEFAULT_BUILD_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$DEFAULT_BUILD_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$DEFAULT_BUILD_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

          # update project settings for Runner target
          bundle exec fastlane run update_code_signing_settings use_automatic_signing:false path:Runner.xcodeproj bundle_identifier:io.agora.agorartm.agoraRtmExample team_id:$DEFAULT_BUILD_PROVISION_PROFILE_TEAMID profile_name:$DEFAULT_BUILD_PROVISION_PROFILE_NAME code_sign_identity:$DEFAULT_BUILD_PROVISION_PROFILE_IDENTITY targets:Runner

          # # update project settings for ScreenSharing target
          # bundle exec fastlane run update_code_signing_settings use_automatic_signing:false path:Runner.xcodeproj bundle_identifier:io.agora.agoraRtmExample.ScreenSharing team_id:$DEFAULT_BUILD_PROVISION_PROFILE_TEAMID profile_name:$DEFAULT_BUILD_PROVISION_PROFILE_NAME code_sign_identity:$DEFAULT_BUILD_PROVISION_PROFILE_IDENTITY targets:ScreenSharing

          # replace all DEFAULT_BUILD_PROVISION_PROFILE_NAME in export.plist with $DEFAULT_BUILD_PROVISION_PROFILE_NAME
          sed -i '' "s/DEFAULT_BUILD_PROVISION_PROFILE_NAME/$DEFAULT_BUILD_PROVISION_PROFILE_NAME/g" export.plist

      - name: Update pod repo
        if: ${{ matrix.platform == 'ios' || matrix.platform == 'macos' }}
        run: pod repo update

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}
          flutter-version: ${{ matrix.version }}
          cache: true

      # agora_rtm ships only a podspec (no Package.swift). SwiftPM is the default
      # from Flutter 3.44 on, which breaks the iOS/macOS build, so force CocoaPods.
      # `|| true` because the flag does not exist on older Flutter versions.
      - name: Force CocoaPods instead of Swift Package Manager
        if: ${{ matrix.platform == 'ios' || matrix.platform == 'macos' }}
        shell: bash
        run: flutter config --no-enable-swift-package-manager || true

      - name: Build
        env:
          BUILD_MY_APP_ID: ${{ secrets.MY_APP_ID }}
          BUILD_APP_ID_RTM: ${{ secrets.APP_ID_RTM }}
        shell: bash
        working-directory: example
        run: |
          if [ "${{ matrix.app_id_secret }}" == "MY_APP_ID" ]; then
            DEFAULT_BUILD_APP_ID="$BUILD_MY_APP_ID"
          else
            DEFAULT_BUILD_APP_ID="$BUILD_APP_ID_RTM"
          fi
          if [ -z "$DEFAULT_BUILD_APP_ID" ]; then
            echo "::error::Selected secret ${{ matrix.app_id_secret }} is empty"
            exit 1
          fi

          # show flutter version
          flutter --version && which flutter

          # install dependencies
          flutter pub get

          # prepare build command, android: apk, ios: ipa, macos: macos, windows: (empty), web: web
          build_command=""
          if [ "$platform" == "android" ]; then
            build_command="flutter build apk"
          elif [ "$platform" == "ios" ]; then
            build_command="flutter build ipa"
          elif [ "$platform" == "macos" ]; then
            build_command="flutter build macos"
          elif [ "$platform" == "windows" ]; then
            build_command="flutter build windows"
          elif [ "$platform" == "web" ]; then
            build_command="flutter build web"
          fi

          # prepare build options
          build_options=""

          # append extra build options
          if [ -n "$extra_build_options" ]; then
            build_options="$build_options $extra_build_options"
          fi

          # prepare default build arguments, if current platform is web, set DEFAULT_BUILD_APP_ID to empty string
          if [ "$platform" == "web" ]; then
            DEFAULT_BUILD_APP_ID=""
          fi

          build_arguments="--dart-define=TEST_APP_ID=$DEFAULT_BUILD_APP_ID --dart-define=TEST_TOKEN="" --dart-define=TEST_CHANNEL_ID="testapi" --dart-define=INTERNAL_TESTING=true"
          
          # append extra build arguments
          if [ -n "$extra_build_arguments" ]; then
            build_arguments="$build_arguments $extra_build_arguments"
          fi

          # append build arguments for ios
          if [ "$platform" == "ios" ]; then
            build_arguments="--export-options-plist ios/export.plist $build_arguments"
          fi

          # run build command
          echo "build command: $build_command $build_options $build_arguments"
          $build_command $build_options $build_arguments
          
          # create output directory if it doesn't exist
          if [ ! -d "../output" ]; then
            mkdir -p ../output
          fi

          # copy build result to output directory by different platforms
          if [ "$platform" == "android" ]; then
            # copy files in build/app/outputs/flutter-apk directory to ../output directory
            cp build/app/outputs/flutter-apk/* ../output

            # copy whole symbol directory to ../output directory if it exists
            if [ -d "build/app/outputs/native-debug-symbols" ]; then
              cp -r build/app/outputs/native-debug-symbols ../output
            fi
          elif [ "$platform" == "ios" ]; then
            # copy build/ios/ipa/agora_rtm_example.ipa to ../output directory
            cp build/ios/ipa/agora_rtm_example.ipa ../output

            # copy dSYMs in build/ios/archive/Runner.xcarchive/dSYMs directory to ../output directory
            cp -RP build/ios/archive/Runner.xcarchive/dSYMs ../output
          elif [ "$platform" == "macos" ]; then
            # cp example/build/macos/Build/Products/*/agora_rtm_example.app to ../output directory
            cp -RP build/macos/Build/Products/*/agora_rtm_example.app ../output

            # mkdir dSYMs directory in ../output directory if it doesn't exist
            if [ ! -d "../output/dSYMs" ]; then
              mkdir -p ../output/dSYMs
            fi

            # copy all dSYM files from example/build/macos/Build/Products and subdirectories to ../output/dSYMs directory
            cp -RP build/macos/Build/Products/**/*.dSYM ../output/dSYMs
          elif [ "$platform" == "windows" ]; then
            # since flutter have no plain to support to build to run on 32-bit windows, we only need concern about the 64-bit windows

            # copy pdb symbols for a given build config, if any exist.
            # NOTE: bash does not expand `**` recursively unless globstar is set, and
            # plugin pdb files are not always emitted, so use find and treat a missing
            # pdb as non-fatal instead of letting `cp` fail the whole job.
            copy_plugin_pdbs() {
              local config="$1"
              local dest="$2"
              if [ ! -d "build/windows/x64/plugins" ]; then
                return 0
              fi
              find "build/windows/x64/plugins" -type f -path "*/${config}/*.pdb" \
                -exec cp {} "$dest" \; || true
            }

            # copy whole build/windows/x64/runner/Release directory to ../output if the directory exists
            if [ -d "build/windows/x64/runner/Release" ]; then
              cp -r build/windows/x64/runner/Release ../output
              copy_plugin_pdbs "Release" "../output/Release"
            fi

            # copy whole build/windows/x64/runner/Debug directory to ../output if the directory exists
            if [ -d "build/windows/x64/runner/Debug" ]; then
              cp -r build/windows/x64/runner/Debug ../output
              copy_plugin_pdbs "Debug" "../output/Debug"
            fi
          elif [ "$platform" == "web" ]; then
            # copy all files and files in subdirectories to ../output directory
            cp -r build/web/* ../output
          fi

      - name: Generate artifact name
        id: generate_artifact_name
        shell: bash
        run: |
          # get pub_version from pubspec.yaml
          pub_version=$(grep 'version: ' pubspec.yaml | sed -e 's,.*: \(.*\),\1,')
          
          # get build_timestamp
          build_timestamp=$(date +%Y%m%d%H%M%S)

          # generate artifact_name. The Flutter version is part of the name because
          # the same platform is now built against several Flutter versions, and
          # artifact names must be unique within a run.
          # printf, not echo: `tr` would turn echo's trailing newline into a dash.
          flutter_version_slug="$(printf '%s' "${{ matrix.version }}" | tr -c '[:alnum:].' '-')"
          artifact_name="agora_rtm_example_${{ matrix.platform }}_flutter${flutter_version_slug}_${{ matrix.app_id_secret }}_${pub_version}_${build_timestamp}_${{ github.run_id }}"
          echo "artifact_name=$artifact_name" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.generate_artifact_name.outputs.artifact_name }}
          path: output
          if-no-files-found: error

      - name: Setup download url
        id: setup_output
        # Only the primary Flutter version publishes the per-platform link, so the
        # PR comment does not depend on which matrix job finishes last.
        if: ${{ matrix.primary }}
        shell: bash
        run: |
          # see https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/passing-information-between-jobs
          current_platform="${{ matrix.platform }}"
          echo "artifact_nightly_link_${current_platform}=https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/${{ steps.generate_artifact_name.outputs.artifact_name }}.zip" >> $GITHUB_OUTPUT

  comment:
    runs-on: ubuntu-latest
    if: ${{ inputs.issue_number != null && !cancelled() }}
    needs: [build]
    steps:
      - uses: peter-evans/create-or-update-comment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ inputs.issue_number }}
          body: |
            Build Job: 
              https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Build Results:
              - ${{ needs.build.outputs.artifact_nightly_link_android }}
              - ${{ needs.build.outputs.artifact_nightly_link_ios }}
              - ${{ needs.build.outputs.artifact_nightly_link_macos }}
              - ${{ needs.build.outputs.artifact_nightly_link_windows }}
              - ${{ needs.build.outputs.artifact_nightly_link_web }}

            > This comment is commented by bot, do not edit it directly
